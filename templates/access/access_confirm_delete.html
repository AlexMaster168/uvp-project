{% extends "base.html" %}
{% block content %}
    <div class="row mt-5">
        <div class="col-md-6 offset-md-3">
            <div class="card shadow-sm border-danger">
                <div class="card-body text-center p-5">
                    <div class="text-danger mb-3">
                        <i class="bi bi-exclamation-triangle display-1"></i>
                    </div>
                    <h3 class="mb-4">{{ _('Удалить доступ к') }} <br><span
                            class="text-primary">{{ object.url or object.description }}</span>?</h3>
                    <form method="post" class="d-flex justify-content-center gap-3 mt-4">
                        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                        <a href="{{ url('projects:project_detail', pk=object.project.pk) }}"
                           class="btn btn-secondary btn-lg px-4">{{ _('Отмена') }}</a>
                        <button type="submit" class="btn btn-danger btn-lg px-4">{{ _('Удалить') }}</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
