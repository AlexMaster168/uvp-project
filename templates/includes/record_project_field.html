{% if form.errors %}
<div class="alert alert-danger" role="alert">
    {% for field in form %}{% for error in field.errors %}<div>{{ field.label }}: {{ error }}</div>{% endfor %}{% endfor %}
    {% for error in form.non_field_errors() %}<div>{{ error }}</div>{% endfor %}
</div>
{% endif %}
<div class="mb-3">
    <label class="form-label" for="{{ form.project.id_for_label }}">{{ _('Проект') }}</label>
    {{ form.project }}
    <div class="form-text">Оберіть проєкт, до якого належить цей запис.</div>
</div>
