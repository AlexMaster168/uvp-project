{% extends "base.html" %}
{% block title %}Файл{% endblock %}
{% block content %}
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-body">
                    <h4>Загрузить файл</h4>
                    <form method="post" enctype="multipart/form-data">{% csrf_token %}
                        <div class="mb-3">
                            <label>Проект</label>
                            <select name="project" class="form-select">
                                {% for p in view.model.project.field.related_model.objects.all() %}
                                    <option value="{{ p.id }}"
                                            {% if request.GET.project|add:"0" == p.id %}selected{% endif %}>{{ p.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3"><label>Файл</label><input type="file" name="file" class="form-control"
                                                                    required></div>
                        <div class="mb-3"><label>Описание</label><textarea name="description"
                                                                           class="form-control"></textarea></div>
                        <button type="submit" class="btn btn-primary">Загрузить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
