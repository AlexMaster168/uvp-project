{% extends "base.html" %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0">Загрузка файла</h4>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                        <div class="d-none">{{ form.project }}</div>

                        <div class="mb-3">
                            <label class="form-label">Файл</label>
                            {{ form.file }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            {{ form.description }}
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <button type="button" class="btn btn-secondary" onclick="history.back()">Назад</button>
                            <button type="submit" class="btn btn-primary px-4">Загрузить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
