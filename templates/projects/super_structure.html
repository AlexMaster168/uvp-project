<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Общая структура проектов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        #toolbar {
            background: #212529;
            color: white;
            border-bottom: 1px solid #444;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #rete-container {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #343a40;
            overflow: hidden;
        }

        #connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        #nodes-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            pointer-events: none;
            z-index: 1;
        }

        .node {
            background: white;
            border: 2px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            position: absolute;
            width: 240px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            user-select: none;
            transition: transform 0.1s;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
        }

        .node:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .node-header {
            padding: 8px 12px;
            border-radius: 6px 6px 0 0;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .node-content {
            padding: 12px;
            font-size: 14px;
            color: #333;
        }

        .node-actions {
            border-top: 1px solid #eee;
            padding: 8px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: #f8f9fa;
            border-radius: 0 0 8px 8px;
        }

        .action-btn {
            cursor: pointer;
            color: #555;
            transition: color 0.2s;
            font-size: 16px;
        }

        .action-btn:hover {
            color: #000;
        }

        .action-btn.delete:hover {
            color: #dc3545;
        }

        .action-btn.edit:hover {
            color: #0d6efd;
        }

        .owner-node {
            border-color: #f59e0b;
            border-width: 2px;
        }

        .owner-node .node-header {
            background: #f59e0b;
        }

        .project-node {
            border-color: #3b82f6;
            border-width: 2px;
        }

        .project-node .node-header {
            background: #3b82f6;
        }

        .connection-line {
            stroke: #6c757d;
            stroke-width: 2;
            fill: none;
            opacity: 0.6;
        }

        .connection-line:hover {
            stroke: #fff;
            opacity: 1;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="toolbar">
    <div class="d-flex align-items-center gap-2">
        <a href="{{ url('projects:project_list') }}" class="btn btn-outline-light btn-sm"><i
                class="bi bi-arrow-left"></i> Список</a>
        <div class="vr bg-secondary"></div>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#newProjectModal"><i
                class="bi bi-plus-lg"></i> Новый проект
        </button>
        <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#newUserModal"><i
                class="bi bi-person-plus"></i> Новый Owner (Superuser)
        </button>
    </div>
    <div class="d-flex align-items-center gap-2">
        <button id="save-btn" class="btn btn-success btn-sm"><i class="bi bi-cloud-upload"></i> Сохранить позицию
        </button>
    </div>
</div>

<div id="rete-container">
    <svg id="connections-layer"></svg>
    <div id="nodes-layer"></div>
</div>

<div class="modal fade" id="newProjectModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Новый проект</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label>Владелец (Owner)</label>
                    <select id="new-proj-owner" class="form-select">
                        {% for su in superusers %}
                            <option value="{{ su.id }}">{{ su.username }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label>Название</label>
                    <input type="text" id="new-proj-name" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Описание</label>
                    <textarea id="new-proj-desc" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                    <label>Статус</label>
                    <select id="new-proj-status" class="form-select">
                        <option value="planned">Запланирован</option>
                        <option value="in_progress">В работе</option>
                        <option value="idle">Простой</option>
                        <option value="sleep">Заморожен</option>
                        <option value="finished">Завершен</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Логотип</label>
                    <input type="file" id="new-proj-logo" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="createProject()">Создать</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="newUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Новый Owner (Superuser)</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" id="new-user-name" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" id="new-user-email" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Пароль</label>
                    <input type="password" id="new-user-pass" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-warning" onclick="createUser()">Создать</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editProjectModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Редактировать проект</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-proj-id">
                <div class="mb-3">
                    <label>Название</label>
                    <input type="text" id="edit-proj-name" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Описание</label>
                    <textarea id="edit-proj-desc" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                    <label>Статус</label>
                    <select id="edit-proj-status" class="form-select">
                        <option value="planned">Запланирован</option>
                        <option value="in_progress">В работе</option>
                        <option value="idle">Простой</option>
                        <option value="sleep">Заморожен</option>
                        <option value="finished">Завершен</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Логотип</label>
                    <div class="mb-2">
                        <img id="edit-proj-current-logo" src="" alt="Текущий логотип"
                             style="max-height: 80px; display: none; border-radius: 4px; border: 1px solid #ddd;">
                    </div>
                    <input type="file" id="edit-proj-logo" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="updateProject()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const container = document.getElementById('rete-container');
    const nodesLayer = document.getElementById('nodes-layer');
    const svgLayer = document.getElementById('connections-layer');
    const editModal = new bootstrap.Modal(document.getElementById('editProjectModal'));
    const createModal = new bootstrap.Modal(document.getElementById('newProjectModal'));
    const createUserModal = new bootstrap.Modal(document.getElementById('newUserModal'));

    function getCookie(name) {
        let v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
        return v ? v[2] : null;
    }

    class SuperViz {
        constructor() {
            this.nodes = [];
            this.connections = [];
            this.drag = {active: false, node: null, offX: 0, offY: 0};
            this.scale = 1;
            this.panX = 0;
            this.panY = 0;
            this.init();
        }

        async init() {
            await this.loadData();
            this.render();
            this.events();
        }

        async loadData() {
            try {
                const res = await fetch(`/api/projects/super-structure/`);
                if (res.ok) {
                    const data = await res.json();
                    this.nodes = data.nodes || [];
                    this.connections = data.connections || [];
                }
            } catch (e) {
                console.error(e);
            }
        }

        openEditModal(node) {
            document.getElementById('edit-proj-id').value = node.data.db_id;
            document.getElementById('edit-proj-name').value = node.title;
            document.getElementById('edit-proj-desc').value = node.data.description || "";
            document.getElementById('edit-proj-status').value = node.data.status || 'planned';

            const logoImg = document.getElementById('edit-proj-current-logo');
            if (node.data.logo) {
                logoImg.src = node.data.logo;
                logoImg.style.display = 'block';
            } else {
                logoImg.style.display = 'none';
                logoImg.src = '';
            }

            document.getElementById('edit-proj-logo').value = "";
            editModal.show();
        }

        async deleteNode(node) {
            if (!confirm(`Удалить проект "${node.title}"?`)) return;
            try {
                const res = await fetch(`/api/projects/${node.data.db_id}/`, {
                    method: 'DELETE',
                    headers: {'X-CSRFToken': getCookie('csrftoken')}
                });
                if (res.ok) this.init();
            } catch (e) {
                alert('Error');
            }
        }

        render() {
            nodesLayer.innerHTML = '';
            svgLayer.innerHTML = '';

            const transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.scale})`;
            nodesLayer.style.transform = transform;

            const svgGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            svgGroup.setAttribute("transform", `translate(${this.panX}, ${this.panY}) scale(${this.scale})`);
            svgLayer.appendChild(svgGroup);

            this.connections.forEach(c => {
                const s = this.nodes.find(n => n.id === c.source);
                const t = this.nodes.find(n => n.id === c.target);
                if (s && t) this.drawBezier(s, t, svgGroup);
            });

            this.nodes.forEach(n => {
                const el = document.createElement('div');
                el.className = `node ${n.type}-node`;
                el.style.left = n.x + 'px';
                el.style.top = n.y + 'px';

                let icon = n.type === 'owner' ? 'person-circle' : 'folder';

                let actionsHtml = '';
                if (n.type === 'project') {
                    actionsHtml = `
                        <div class="node-actions">
                            <i class="bi bi-pencil action-btn edit" title="Редактировать"></i>
                            <i class="bi bi-trash action-btn delete" title="Удалить"></i>
                        </div>
                    `;
                }

                el.innerHTML = `
                    <div class="node-header"><span><i class="bi bi-${icon}"></i> ${n.type.toUpperCase()}</span></div>
                    <div class="node-content">
                        <strong>${n.title}</strong>
                    </div>
                    ${actionsHtml}
                `;

                el.onmousedown = (e) => {
                    e.stopPropagation();
                    this.drag = {active: true, node: n, offX: e.offsetX, offY: e.offsetY};
                };

                el.onclick = (e) => {
                    if (n.type === 'project') {
                        window.location.href = `/projects/${n.data.db_id}/structure/`;
                    }
                };

                if (n.type === 'project') {
                    const editBtn = el.querySelector('.edit');
                    const delBtn = el.querySelector('.delete');

                    editBtn.onclick = (e) => {
                        e.stopPropagation();
                        this.openEditModal(n);
                    };

                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        this.deleteNode(n);
                    };
                }

                nodesLayer.appendChild(el);
            });
        }

        drawBezier(s, t, container) {
            const nodeWidth = 240;
            const nodeHeight = 80;

            const x1 = s.x + (nodeWidth / 2);
            const y1 = s.y + nodeHeight;

            const x2 = t.x + (nodeWidth / 2);
            const y2 = t.y;

            const dist = Math.abs(y2 - y1) * 0.5;
            const cp1x = x1;
            const cp1y = y1 + dist;
            const cp2x = x2;
            const cp2y = y2 - dist;

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M ${x1} ${y1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2}`);
            path.setAttribute("class", "connection-line");
            path.setAttribute("fill", "none");
            container.appendChild(path);
        }

        events() {
            container.onmousedown = (e) => {
                if (e.target === container || e.target === svgLayer) {
                    this.isPanning = true;
                    this.panStart = {x: e.clientX - this.panX, y: e.clientY - this.panY};
                }
            };
            document.onmousemove = (e) => {
                if (this.drag.active && this.drag.node) {
                    this.drag.node.x = (e.clientX - container.getBoundingClientRect().left - this.panX) / this.scale - this.drag.offX;
                    this.drag.node.y = (e.clientY - container.getBoundingClientRect().top - this.panY) / this.scale - this.drag.offY;
                    this.render();
                } else if (this.isPanning) {
                    this.panX = e.clientX - this.panStart.x;
                    this.panY = e.clientY - this.panStart.y;
                    this.render();
                }
            };
            document.onmouseup = () => {
                this.drag.active = false;
                this.isPanning = false;
            };
            container.onwheel = (e) => {
                e.preventDefault();
                this.scale *= (e.deltaY > 0 ? 0.9 : 1.1);
                this.render();
            };
            document.getElementById('save-btn').onclick = async () => {
                await fetch(`/api/projects/super-structure/`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
                    body: JSON.stringify({nodes: this.nodes})
                });
                alert('Сохранено!');
            };
        }
    }

    const viz = new SuperViz();

    async function createProject() {
        const name = document.getElementById('new-proj-name').value;
        const desc = document.getElementById('new-proj-desc').value;
        const ownerId = document.getElementById('new-proj-owner').value;
        const status = document.getElementById('new-proj-status').value;
        const logo = document.getElementById('new-proj-logo').files[0];

        if (!name || !ownerId) return;

        const formData = new FormData();
        formData.append('name', name);
        formData.append('description', desc);
        formData.append('owner_id', ownerId);
        formData.append('status', status);
        if (logo) {
            formData.append('logo', logo);
        }

        try {
            const res = await fetch('/api/projects/', {
                method: 'POST',
                headers: {'X-CSRFToken': getCookie('csrftoken')},
                body: formData
            });
            if (res.ok) {
                createModal.hide();
                viz.init();
            }
        } catch (e) {
            alert('Error');
        }
    }

    async function createUser() {
        const name = document.getElementById('new-user-name').value;
        const email = document.getElementById('new-user-email').value;
        const pass = document.getElementById('new-user-pass').value;
        if (!name || !pass) return;

        try {
            const res = await fetch('/api/users/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
                body: JSON.stringify({
                    username: name,
                    email: email,
                    password: pass,
                    status: 'active',
                    is_superuser: true
                })
            });
            if (res.ok) {
                createUserModal.hide();
                location.reload();
            } else {
                alert('Ошибка создания пользователя');
            }
        } catch (e) {
            alert('Error');
        }
    }

    async function updateProject() {
        const id = document.getElementById('edit-proj-id').value;
        const name = document.getElementById('edit-proj-name').value;
        const desc = document.getElementById('edit-proj-desc').value;
        const status = document.getElementById('edit-proj-status').value;
        const logo = document.getElementById('edit-proj-logo').files[0];

        const formData = new FormData();
        formData.append('name', name);
        formData.append('description', desc);
        formData.append('status', status);
        if (logo) {
            formData.append('logo', logo);
        }

        try {
            const res = await fetch(`/api/projects/${id}/`, {
                method: 'PATCH',
                headers: {'X-CSRFToken': getCookie('csrftoken')},
                body: formData
            });
            if (res.ok) {
                editModal.hide();
                viz.init();
            }
        } catch (e) {
            alert('Error');
        }
    }
</script>
</body>
</html>
