<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Структура проекта</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        #toolbar {
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #rete-container {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f0f2f5;
            overflow: hidden;
        }

        #connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .node {
            background: white;
            border: 2px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            position: absolute;
            min-width: 220px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            user-select: none;
            transition: transform 0.1s, border-color 0.2s;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }

        .node:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .node-header {
            padding: 8px 12px;
            border-radius: 6px 6px 0 0;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .node-content {
            padding: 12px;
            font-size: 14px;
            position: relative;
        }

        .node-actions {
            border-top: 1px solid #eee;
            padding: 6px;
            display: flex;
            justify-content: flex-end;
            gap: 5px;
        }

        .task-node {
            border-color: #3b82f6;
        }

        .task-node .node-header {
            background: #3b82f6;
        }

        .subtask-node {
            border-color: #6366f1;
        }

        .subtask-node .node-header {
            background: #6366f1;
        }

        .access-node {
            border-color: #8b5cf6;
        }

        .access-node .node-header {
            background: #8b5cf6;
        }

        .billing-node {
            border-color: #10b981;
        }

        .billing-node .node-header {
            background: #10b981;
        }

        .media-node {
            border-color: #f59e0b;
        }

        .media-node .node-header {
            background: #f59e0b;
        }

        .badge-status {
            padding: 3px 8px;
            border-radius: 12px;
            color: white;
            font-size: 11px;
        }

        .bg-todo {
            background: #6b7280;
        }

        .bg-in-progress {
            background: #f59e0b;
        }

        .bg-done {
            background: #10b981;
        }

        .bg-expense {
            background: #ef4444;
        }

        .bg-income {
            background: #10b981;
        }

        .connection-line {
            stroke: #9ca3af;
            stroke-width: 2;
            fill: none;
        }

        .connection-line:hover {
            stroke: #3b82f6;
            stroke-width: 3;
            cursor: pointer;
        }

        .connecting-mode .node {
            cursor: crosshair;
        }

        .node.selected-source {
            border-color: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        .socket-points {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px dashed #eee;
            font-size: 11px;
            color: #666;
        }

        .socket {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid #666;
        }

        .socket-in {
            background: #eee;
            margin-right: 5px;
        }

        .socket-out {
            background: #eee;
            margin-left: 5px;
        }

        .socket-flow {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        .socket-hierarchy {
            background: #6366f1;
            border-color: #6366f1;
        }
    </style>
</head>
<body>
<div id="toolbar">
    <div class="d-flex align-items-center gap-2">
        <a href="{{ url('projects:project_detail', pk=project.id) }}" class="btn btn-outline-secondary btn-sm"><i
                class="bi bi-arrow-left"></i> Назад</a>
        <div class="vr"></div>
        <button class="btn btn-primary btn-sm" onclick="viz.openModal('task')"><i class="bi bi-check-square"></i> Задача
        </button>
        <button class="btn btn-indigo btn-sm text-white" style="background: #6366f1" onclick="viz.openModal('subtask')">
            <i class="bi bi-list-task"></i> Подзадача
        </button>
        <button class="btn btn-purple btn-sm" style="background:#8b5cf6; color:white;"
                onclick="viz.openModal('access')"><i class="bi bi-key"></i> Доступ
        </button>
        <button class="btn btn-success btn-sm" onclick="viz.openModal('billing')"><i class="bi bi-currency-dollar"></i>
            Финансы
        </button>
        <button class="btn btn-warning btn-sm text-white" onclick="viz.openModal('media')"><i
                class="bi bi-file-earmark-plus"></i> Медиа
        </button>
    </div>
    <div class="d-flex align-items-center gap-2">
        <a href="{{ url('projects:super_structure') }}" class="btn btn-outline-dark btn-sm"><i
                class="bi bi-diagram-3"></i> Супер-структура</a>
        <div class="vr"></div>
        <div class="btn-group">
            <button id="connect-flow-btn" class="btn btn-outline-primary btn-sm" onclick="viz.toggleConnectMode('flow')"
                    title="Задача -> Задача (Зависимость)"><i class="bi bi-arrow-right"></i> Поток
            </button>
            <button id="connect-hier-btn" class="btn btn-outline-indigo btn-sm"
                    style="border-color: #6366f1; color: #6366f1" onclick="viz.toggleConnectMode('hierarchy')"
                    title="Задача -> Подзадача (Иерархия)"><i class="bi bi-diagram-2"></i> Иерархия
            </button>
        </div>
        <button class="btn btn-outline-dark btn-sm" onclick="viz.autoLayout()"><i class="bi bi-grid-3x3"></i> Авто
        </button>
        <button id="save-btn" class="btn btn-dark btn-sm"><i class="bi bi-cloud-upload"></i> Сохранить</button>
    </div>
</div>

<div id="rete-container">
    <svg id="connections-layer"></svg>
    <div id="nodes-layer"></div>
</div>

<div class="modal fade" id="nodeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Редактирование</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="viz.saveNodeFromModal()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const container = document.getElementById('rete-container');
    const nodesLayer = document.getElementById('nodes-layer');
    const svgLayer = document.getElementById('connections-layer');
    const modalEl = document.getElementById('nodeModal');
    const modalObj = new bootstrap.Modal(modalEl);

    class Visualization {
        constructor(projectId) {
            this.projectId = projectId;
            this.nodes = [];
            this.connections = [];
            this.users = [];
            this.currentNode = null;
            this.drag = {active: false, node: null, offX: 0, offY: 0};
            this.connectMode = null;
            this.sourceNodeId = null;
            this.init();
        }

        async init() {
            await this.loadData();
            this.render();
            this.events();
        }

        async loadData() {
            try {
                const res = await fetch(`/api/projects/${this.projectId}/structure/`);
                if (res.ok) {
                    const data = await res.json();
                    this.nodes = data.nodes || [];
                    this.connections = data.connections || [];
                    this.users = data.users || [];
                    if (this.nodes.length === 0) this.addNode('project', 'project', 'Проект', 'active', 50, 50, {});
                }
            } catch (e) {
                console.error(e);
            }
        }

        addNode(id, type, title, status, x, y, data) {
            this.nodes.push({id, type, title, status, x, y, data});
            this.render();
        }

        updateNode(id, newData) {
            const node = this.nodes.find(n => n.id === id);
            if (node) Object.assign(node, newData);
            this.render();
        }

        deleteNode(id) {
            if (confirm('Удалить элемент?')) {
                this.nodes = this.nodes.filter(n => n.id !== id);
                this.connections = this.connections.filter(c => c.source !== id && c.target !== id);
                this.render();
            }
        }

        toggleConnectMode(mode) {
            if (this.connectMode === mode) {
                this.connectMode = null;
                this.sourceNodeId = null;
                document.body.classList.remove('connecting-mode');
            } else {
                this.connectMode = mode;
                this.sourceNodeId = null;
                document.body.classList.add('connecting-mode');
            }
            this.updateToolbar();
            this.render();
        }

        updateToolbar() {
            const btnFlow = document.getElementById('connect-flow-btn');
            const btnHier = document.getElementById('connect-hier-btn');

            btnFlow.classList.remove('active', 'btn-primary');
            btnFlow.classList.add('btn-outline-primary');

            btnHier.classList.remove('active');
            btnHier.style.backgroundColor = '';
            btnHier.style.color = '#6366f1';

            if (this.connectMode === 'flow') {
                btnFlow.classList.add('active', 'btn-primary');
                btnFlow.classList.remove('btn-outline-primary');
            } else if (this.connectMode === 'hierarchy') {
                btnHier.classList.add('active');
                btnHier.style.backgroundColor = '#6366f1';
                btnHier.style.color = 'white';
            }
        }

        handleNodeClick(nodeId) {
            if (this.connectMode) {
                if (!this.sourceNodeId) {
                    this.sourceNodeId = nodeId;
                    this.render();
                } else {
                    if (this.sourceNodeId !== nodeId) {
                        const exists = this.connections.find(c => c.source === this.sourceNodeId && c.target === nodeId);
                        if (!exists) {
                            const source = this.nodes.find(n => n.id === this.sourceNodeId);
                            const target = this.nodes.find(n => n.id === nodeId);

                            let allowed = false;
                            if (this.connectMode === 'flow') {
                                if (source.type === 'task' && target.type === 'task') allowed = true;
                            } else if (this.connectMode === 'hierarchy') {
                                if (source.type === 'task' && target.type === 'subtask') allowed = true;
                            }

                            if (allowed) {
                                this.connections.push({source: this.sourceNodeId, target: nodeId});
                            } else {
                                alert('Неверный тип связи для выбранных узлов');
                            }
                        }
                    }
                    this.sourceNodeId = null;
                    this.toggleConnectMode(null);
                }
            }
        }

        openModal(type, nodeId = null) {
            this.currentNode = nodeId ? this.nodes.find(n => n.id === nodeId) : null;
            const isEdit = !!this.currentNode;
            const titleEl = document.getElementById('modalTitle');
            const bodyEl = document.getElementById('modalBody');

            titleEl.textContent = isEdit ? 'Редактировать' : 'Создать';

            let html = '';
            const data = isEdit ? this.currentNode.data : {};
            const status = isEdit ? this.currentNode.status : '';

            const userOptions = this.users.map(u =>
                `<option value="${u.id}" ${data.assignee == u.id ? 'selected' : ''}>${u.username}</option>`
            ).join('');
            const usersSelect = `
                <label>Исполнитель</label>
                <select id="inp-assignee" class="form-select mb-2">
                    <option value="">Не назначен</option>
                    ${userOptions}
                </select>`;

            if (type === 'task' || type === 'subtask') {
                html = `
                    <label>Название</label><input type="text" id="inp-title" class="form-control mb-2" value="${data.title || ''}">
                    <label>Статус</label>
                    <select id="inp-status" class="form-select mb-2">
                        <option value="todo" ${status === 'todo' ? 'selected' : ''}>К выполнению</option>
                        <option value="in_progress" ${status === 'in_progress' ? 'selected' : ''}>В работе</option>
                        <option value="done" ${status === 'done' ? 'selected' : ''}>Готово</option>
                    </select>
                    ${usersSelect}`;
            } else if (type === 'access') {
                html = `
                    <label>URL</label><input type="text" id="inp-url" class="form-control mb-2" value="${data.url || ''}">
                    <label>Логин</label><input type="text" id="inp-login" class="form-control mb-2" value="${data.login || ''}">
                    <label>Пароль</label><input type="text" id="inp-pass" class="form-control" value="${data.password || ''}">`;
            } else if (type === 'billing') {
                html = `
                    <label>Сумма</label><input type="number" id="inp-amount" class="form-control mb-2" value="${data.amount || ''}">
                    <label>Тип</label>
                    <select id="inp-status" class="form-select">
                        <option value="expense" ${status === 'expense' ? 'selected' : ''}>Расход</option>
                        <option value="income" ${status === 'income' ? 'selected' : ''}>Доход</option>
                    </select>`;
            } else if (type === 'media') {
                html = `<label>Описание / Название</label><input type="text" id="inp-title" class="form-control mb-2" value="${data.title || ''}">`;
                if (!isEdit) {
                    html += `<label>Файл</label><input type="file" id="inp-file" class="form-control">`;
                }
            }

            bodyEl.innerHTML = html;
            bodyEl.dataset.type = type;
            modalObj.show();
        }

        async saveNodeFromModal() {
            const bodyEl = document.getElementById('modalBody');
            const type = bodyEl.dataset.type;
            const isEdit = !!this.currentNode;

            let title, status, data = {};

            if (type === 'task' || type === 'subtask') {
                title = document.getElementById('inp-title').value;
                status = document.getElementById('inp-status').value;
                const assignee = document.getElementById('inp-assignee').value;
                data = {title, assignee};
            } else if (type === 'access') {
                data = {
                    url: document.getElementById('inp-url').value,
                    login: document.getElementById('inp-login').value,
                    password: document.getElementById('inp-pass').value
                };
                title = data.login;
                status = 'active';
            } else if (type === 'billing') {
                data = {amount: document.getElementById('inp-amount').value};
                status = document.getElementById('inp-status').value;
                title = `${data.amount}`;
            } else if (type === 'media') {
                title = document.getElementById('inp-title').value;
                if (!isEdit) {
                    const fileInput = document.getElementById('inp-file');
                    if (fileInput.files.length > 0) {
                        const formData = new FormData();
                        formData.append('file', fileInput.files[0]);
                        formData.append('project', this.projectId);
                        formData.append('description', title);
                        try {
                            const res = await fetch('/api/media_files/', {
                                method: 'POST',
                                headers: {'X-CSRFToken': this.getCookie('csrftoken')},
                                body: formData
                            });
                            if (res.ok) {
                                const mediaData = await res.json();
                                this.addNode('media_' + mediaData.id, 'media', title || mediaData.file, 'active', 100, 100, {
                                    db_id: mediaData.id,
                                    title: title || mediaData.file
                                });
                                modalObj.hide();
                                return;
                            }
                        } catch (e) {
                            console.error(e);
                        }
                    }
                }
                data = {title};
                status = 'active';
            }

            if (isEdit) {
                this.updateNode(this.currentNode.id, {title, status, data: {...this.currentNode.data, ...data}});
            } else if (type !== 'media') {
                this.addNode('temp_' + Date.now(), type, title, status, 100, 100, data);
            }
            modalObj.hide();
        }

        render() {
            nodesLayer.innerHTML = '';
            svgLayer.innerHTML = '';

            this.connections.forEach(c => {
                const source = this.nodes.find(n => n.id === c.source);
                const target = this.nodes.find(n => n.id === c.target);
                if (source && target) {
                    let color = '#9ca3af';
                    if (source.type === 'task' && target.type === 'task') color = '#3b82f6';
                    if (source.type === 'task' && target.type === 'subtask') color = '#6366f1';

                    this.drawArrow(source, target, color);
                }
            });

            this.nodes.forEach(n => {
                const el = document.createElement('div');
                el.className = `node ${n.type}-node`;
                if (this.sourceNodeId === n.id) el.classList.add('selected-source');

                el.style.left = n.x + 'px';
                el.style.top = n.y + 'px';

                let icon = 'circle';
                if (n.type === 'task') icon = 'check-square';
                else if (n.type === 'subtask') icon = 'list-task';
                else if (n.type === 'access') icon = 'key';
                else if (n.type === 'billing') icon = 'currency-dollar';
                else if (n.type === 'media') icon = 'file-earmark';
                else if (n.type === 'project') icon = 'folder';

                let badges = '';
                if (n.status && n.type !== 'access' && n.type !== 'media') {
                    let cl = 'bg-secondary';
                    if (n.status === 'todo') cl = 'bg-todo';
                    if (n.status === 'in_progress') cl = 'bg-in-progress';
                    if (n.status === 'done' || n.status === 'income') cl = 'bg-done';
                    if (n.status === 'expense') cl = 'bg-expense';
                    badges = `<span class="badge-status ${cl}">${n.status}</span>`;
                }

                if (n.data.assignee) {
                    const user = this.users.find(u => u.id == n.data.assignee);
                    if (user) {
                        badges += ` <span class="badge bg-info text-dark" style="font-size:10px;"><i class="bi bi-person"></i> ${user.username}</span>`;
                    }
                }

                const canEdit = n.type !== 'project';

                let socketsHtml = '';
                if (n.type === 'task') {
                    socketsHtml = `
                        <div class="socket-points">
                            <div><span class="socket socket-flow socket-in" title="Вход (Зависимость)"></span></div>
                            <div>
                                <span class="socket socket-hierarchy socket-out" title="Подзадачи"></span>
                                <span class="socket socket-flow socket-out" title="Выход (Зависимость)"></span>
                            </div>
                        </div>`;
                } else if (n.type === 'subtask') {
                    socketsHtml = `
                        <div class="socket-points">
                            <div><span class="socket socket-hierarchy socket-in" title="Родитель"></span></div>
                        </div>`;
                }

                el.innerHTML = `
                    <div class="node-header">
                        <span><i class="bi bi-${icon}"></i> ${n.type.toUpperCase()}</span>
                    </div>
                    <div class="node-content">
                        <strong>${n.title}</strong><br>${badges}
                    </div>
                    ${socketsHtml}
                    ${canEdit ? `
                    <div class="node-actions">
                        <button class="btn btn-sm btn-light text-primary py-0 px-1" onclick="event.stopPropagation(); viz.openModal('${n.type}', '${n.id}')"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-light text-danger py-0 px-1" onclick="event.stopPropagation(); viz.deleteNode('${n.id}')"><i class="bi bi-trash"></i></button>
                    </div>` : ''}
                `;

                el.onmousedown = (e) => {
                    if (this.connectMode) return;
                    this.drag = {active: true, node: n, offX: e.offsetX, offY: e.offsetY};
                };

                el.onclick = (e) => {
                    e.stopPropagation();
                    this.handleNodeClick(n.id);
                };

                nodesLayer.appendChild(el);
            });
        }

        drawArrow(source, target, color) {
            const sx = source.x + 110;
            const sy = source.y + 50;
            const tx = target.x + 110;
            const ty = target.y + 50;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", sx);
            line.setAttribute("y1", sy);
            line.setAttribute("x2", tx);
            line.setAttribute("y2", ty);
            line.setAttribute("class", "connection-line");
            line.setAttribute("stroke", color);
            line.setAttribute("marker-end", "url(#arrowhead)");

            svgLayer.appendChild(line);
        }

        events() {
            document.onmousemove = (e) => {
                if (this.drag.active && this.drag.node) {
                    this.drag.node.x = e.clientX - this.drag.offX;
                    this.drag.node.y = e.clientY - 60 - this.drag.offY;
                    this.render();
                }
            };
            document.onmouseup = () => {
                this.drag.active = false;
                this.drag.node = null;
            };

            if (!document.getElementById('arrowhead')) {
                const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
                defs.innerHTML = `
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af" />
                    </marker>`;
                svgLayer.appendChild(defs);
            }

            document.getElementById('save-btn').onclick = async () => {
                const btn = document.getElementById('save-btn');
                btn.disabled = true;
                btn.innerHTML = '<i class="bi bi-hourglass"></i> ...';
                try {
                    const res = await fetch(`/api/projects/${this.projectId}/structure/`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json', 'X-CSRFToken': this.getCookie('csrftoken')},
                        body: JSON.stringify({nodes: this.nodes, connections: this.connections})
                    });
                    if (!res.ok) throw new Error('Error');
                    location.reload();
                } catch (e) {
                    alert('Ошибка сохранения');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-cloud-upload"></i> Сохранить';
                }
            };
        }

        autoLayout() {
            let x = 50, y = 50;
            this.nodes.forEach((n, i) => {
                n.x = x;
                n.y = y;
                x += 250;
                if ((i + 1) % 4 === 0) {
                    x = 50;
                    y += 180;
                }
            });
            this.render();
        }

        getCookie(name) {
            let v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
            return v ? v[2] : null;
        }
    }

    const projectId = "{{ project.id }}";
    const viz = new Visualization(projectId);
</script>
</body>
</html>
