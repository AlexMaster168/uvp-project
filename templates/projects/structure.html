<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Структура проекта</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        #toolbar {
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #rete-container {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f0f2f5;
        }

        .node {
            background: white;
            border: 2px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            position: absolute;
            min-width: 200px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            user-select: none;
            transition: transform 0.1s;
        }

        .node:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .node-header {
            padding: 8px 12px;
            border-radius: 6px 6px 0 0;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .node-content {
            padding: 12px;
            font-size: 14px;
        }

        .node-actions {
            border-top: 1px solid #eee;
            padding: 6px;
            display: flex;
            justify-content: flex-end;
            gap: 5px;
        }

        .task-node {
            border-color: #3b82f6;
        }

        .task-node .node-header {
            background: #3b82f6;
        }

        .access-node {
            border-color: #8b5cf6;
        }

        .access-node .node-header {
            background: #8b5cf6;
        }

        .billing-node {
            border-color: #10b981;
        }

        .billing-node .node-header {
            background: #10b981;
        }

        .media-node {
            border-color: #f59e0b;
        }

        .media-node .node-header {
            background: #f59e0b;
        }

        .project-node {
            border-color: #ef4444;
        }

        .project-node .node-header {
            background: #ef4444;
        }

        .badge-status {
            padding: 3px 8px;
            border-radius: 12px;
            color: white;
            font-size: 11px;
        }

        .bg-todo {
            background: #6b7280;
        }

        .bg-in-progress {
            background: #f59e0b;
        }

        .bg-done {
            background: #10b981;
        }

        .bg-expense {
            background: #ef4444;
        }

        .bg-income {
            background: #10b981;
        }
    </style>
</head>
<body>
<div id="toolbar">
    <div class="d-flex align-items-center gap-2">
        <a href="{{ url('projects:project_detail', pk=project.id) }}" class="btn btn-outline-secondary btn-sm"><i
                class="bi bi-arrow-left"></i> Назад</a>
        <div class="vr"></div>
        <button class="btn btn-primary btn-sm" onclick="viz.openModal('task')"><i class="bi bi-check-square"></i> Задача
        </button>
        <button class="btn btn-purple btn-sm" style="background:#8b5cf6; color:white;"
                onclick="viz.openModal('access')"><i class="bi bi-key"></i> Доступ
        </button>
        <button class="btn btn-success btn-sm" onclick="viz.openModal('billing')"><i class="bi bi-currency-dollar"></i>
            Финансы
        </button>
        <button class="btn btn-warning btn-sm text-white" onclick="viz.openModal('media')"><i
                class="bi bi-file-earmark-plus"></i> Медиа
        </button>
    </div>
    <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-dark btn-sm" onclick="viz.autoLayout()"><i class="bi bi-grid-3x3"></i> Авто
        </button>
        <button id="save-btn" class="btn btn-dark btn-sm"><i class="bi bi-cloud-upload"></i> Сохранить</button>
    </div>
</div>

<div id="rete-container"></div>

<div class="modal fade" id="nodeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Редактирование</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="viz.saveNodeFromModal()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const container = document.getElementById('rete-container');
    const modalEl = document.getElementById('nodeModal');
    const modalObj = new bootstrap.Modal(modalEl);

    class Visualization {
        constructor(projectId) {
            this.projectId = projectId;
            this.nodes = [];
            this.currentNode = null;
            this.drag = {active: false, node: null, offX: 0, offY: 0};
            this.init();
        }

        async init() {
            await this.loadData();
            this.render();
            this.events();
        }

        async loadData() {
            try {
                const res = await fetch(`/api/projects/${this.projectId}/structure/`);
                if (res.ok) {
                    const data = await res.json();
                    this.nodes = data.nodes || [];
                    if (this.nodes.length === 0) this.addNode('project', 'project', 'Проект', 'active', 50, 50, {});
                }
            } catch (e) {
                console.error(e);
            }
        }

        addNode(id, type, title, status, x, y, data) {
            this.nodes.push({id, type, title, status, x, y, data});
            this.render();
        }

        updateNode(id, newData) {
            const node = this.nodes.find(n => n.id === id);
            if (node) Object.assign(node, newData);
            this.render();
        }

        deleteNode(id) {
            if (confirm('Удалить элемент? Это действие применится после сохранения.')) {
                this.nodes = this.nodes.filter(n => n.id !== id);
                this.render();
            }
        }

        openModal(type, nodeId = null) {
            this.currentNode = nodeId ? this.nodes.find(n => n.id === nodeId) : null;
            const isEdit = !!this.currentNode;
            const titleEl = document.getElementById('modalTitle');
            const bodyEl = document.getElementById('modalBody');

            titleEl.textContent = isEdit ? 'Редактировать' : 'Создать';

            let html = '';
            const data = isEdit ? this.currentNode.data : {};
            const status = isEdit ? this.currentNode.status : '';

            if (type === 'task') {
                html = `
                        <label>Название</label><input type="text" id="inp-title" class="form-control mb-2" value="${data.title || ''}">
                        <label>Статус</label>
                        <select id="inp-status" class="form-select">
                            <option value="todo" ${status === 'todo' ? 'selected' : ''}>К выполнению</option>
                            <option value="in_progress" ${status === 'in_progress' ? 'selected' : ''}>В работе</option>
                            <option value="done" ${status === 'done' ? 'selected' : ''}>Готово</option>
                        </select>`;
            } else if (type === 'access') {
                html = `
                        <label>URL</label><input type="text" id="inp-url" class="form-control mb-2" value="${data.url || ''}">
                        <label>Логин</label><input type="text" id="inp-login" class="form-control mb-2" value="${data.login || ''}">
                        <label>Пароль</label><input type="text" id="inp-pass" class="form-control" value="${data.password || ''}">`;
            } else if (type === 'billing') {
                html = `
                        <label>Сумма</label><input type="number" id="inp-amount" class="form-control mb-2" value="${data.amount || ''}">
                        <label>Тип</label>
                        <select id="inp-status" class="form-select">
                            <option value="expense" ${status === 'expense' ? 'selected' : ''}>Расход</option>
                            <option value="income" ${status === 'income' ? 'selected' : ''}>Доход</option>
                        </select>`;
            } else if (type === 'media') {
                html = `<label>Описание / Название</label><input type="text" id="inp-title" class="form-control mb-2" value="${data.title || ''}">`;
                if (!isEdit) {
                    html += `<label>Файл</label><input type="file" id="inp-file" class="form-control">`;
                }
            }

            bodyEl.innerHTML = html;
            bodyEl.dataset.type = type;
            modalObj.show();
        }

        async saveNodeFromModal() {
            const bodyEl = document.getElementById('modalBody');
            const type = bodyEl.dataset.type;
            const isEdit = !!this.currentNode;

            let title, status, data = {};

            if (type === 'task') {
                title = document.getElementById('inp-title').value;
                status = document.getElementById('inp-status').value;
                data = {title};
            } else if (type === 'access') {
                data = {
                    url: document.getElementById('inp-url').value,
                    login: document.getElementById('inp-login').value,
                    password: document.getElementById('inp-pass').value
                };
                title = data.login;
                status = 'active';
            } else if (type === 'billing') {
                data = {amount: document.getElementById('inp-amount').value};
                status = document.getElementById('inp-status').value;
                title = `${data.amount}`;
            } else if (type === 'media') {
                title = document.getElementById('inp-title').value;

                if (!isEdit) {
                    // Handle File Upload
                    const fileInput = document.getElementById('inp-file');
                    if (fileInput.files.length > 0) {
                        const formData = new FormData();
                        formData.append('file', fileInput.files[0]);
                        formData.append('project', this.projectId);
                        formData.append('description', title);

                        try {
                            const res = await fetch('/api/media_files/', {
                                method: 'POST',
                                headers: {'X-CSRFToken': this.getCookie('csrftoken')},
                                body: formData
                            });
                            if (res.ok) {
                                const mediaData = await res.json();
                                this.addNode('media_' + mediaData.id, 'media', title || mediaData.file, 'active', 100, 100, {
                                    db_id: mediaData.id,
                                    title: title || mediaData.file
                                });
                                modalObj.hide();
                                return; // Exit, async add handled
                            } else {
                                alert('Ошибка загрузки файла');
                                return;
                            }
                        } catch (e) {
                            console.error(e);
                            alert('Ошибка сети при загрузке');
                            return;
                        }
                    }
                }
                // Edit mode or no file selected (just title update)
                data = {title};
                status = 'active';
            }

            if (isEdit) {
                this.updateNode(this.currentNode.id, {title, status, data: {...this.currentNode.data, ...data}});
            } else if (type !== 'media') {
                this.addNode('temp_' + Date.now(), type, title, status, 100, 100, data);
            }
            modalObj.hide();
        }

        render() {
            container.innerHTML = '';
            this.nodes.forEach(n => {
                const el = document.createElement('div');
                el.className = `node ${n.type}-node`;
                el.style.left = n.x + 'px';
                el.style.top = n.y + 'px';

                let icon = 'circle';
                if (n.type === 'task') icon = 'check-square';
                else if (n.type === 'access') icon = 'key';
                else if (n.type === 'billing') icon = 'currency-dollar';
                else if (n.type === 'media') icon = 'file-earmark';
                else if (n.type === 'project') icon = 'folder';

                let badges = '';
                if (n.status && n.type !== 'access' && n.type !== 'media') {
                    let cl = 'bg-secondary';
                    if (n.status === 'todo') cl = 'bg-todo';
                    if (n.status === 'in_progress') cl = 'bg-in-progress';
                    if (n.status === 'done' || n.status === 'income') cl = 'bg-done';
                    if (n.status === 'expense') cl = 'bg-expense';
                    badges = `<span class="badge-status ${cl}">${n.status}</span>`;
                }

                const canEdit = n.type !== 'project';

                el.innerHTML = `
                        <div class="node-header">
                            <span><i class="bi bi-${icon}"></i> ${n.type.toUpperCase()}</span>
                        </div>
                        <div class="node-content">
                            <strong>${n.title}</strong><br>${badges}
                        </div>
                        ${canEdit ? `
                        <div class="node-actions">
                            <button class="btn btn-sm btn-light text-primary py-0 px-1" onclick="event.stopPropagation(); viz.openModal('${n.type}', '${n.id}')"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-light text-danger py-0 px-1" onclick="event.stopPropagation(); viz.deleteNode('${n.id}')"><i class="bi bi-trash"></i></button>
                        </div>` : ''}
                    `;

                el.onmousedown = (e) => {
                    this.drag = {active: true, node: n, offX: e.offsetX, offY: e.offsetY};
                };
                container.appendChild(el);
            });
        }

        events() {
            document.onmousemove = (e) => {
                if (this.drag.active && this.drag.node) {
                    this.drag.node.x = e.clientX - this.drag.offX;
                    this.drag.node.y = e.clientY - 60 - this.drag.offY;
                    this.render();
                }
            };
            document.onmouseup = () => {
                this.drag.active = false;
                this.drag.node = null;
            };

            document.getElementById('save-btn').onclick = async () => {
                const btn = document.getElementById('save-btn');
                btn.disabled = true;
                btn.innerHTML = '<i class="bi bi-hourglass"></i> ...';
                try {
                    const res = await fetch(`/api/projects/${this.projectId}/structure/`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json', 'X-CSRFToken': this.getCookie('csrftoken')},
                        body: JSON.stringify({nodes: this.nodes})
                    });
                    if (!res.ok) throw new Error('Error saving');
                    location.reload();
                } catch (e) {
                    alert('Ошибка сохранения или нет прав.');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-cloud-upload"></i> Сохранить';
                }
            };
        }

        autoLayout() {
            let x = 50, y = 50;
            this.nodes.forEach((n, i) => {
                n.x = x;
                n.y = y;
                x += 250;
                if ((i + 1) % 4 === 0) {
                    x = 50;
                    y += 180;
                }
            });
            this.render();
        }

        getCookie(name) {
            let v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
            return v ? v[2] : null;
        }
    }

    const projectId = window.location.pathname.split('/').filter(Boolean).pop();
    const viz = new Visualization(projectId);
</script>
</body>
</html>
