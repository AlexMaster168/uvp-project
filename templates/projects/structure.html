{% set global_settings = get_global_settings() %}
<!DOCTYPE html>
<html lang="{{ global_settings.language|default('ru') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Структура проекта') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <style>
        :root {
            --color-task: #0d6efd;
            --color-subtask: #6610f2;
            --color-access: #fd7e14;
            --color-billing: #198754;
            --color-media: #DC143C;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        #toolbar {
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        @media (max-width: 767.98px) {
            #toolbar {
                padding: 8px 10px;
                flex-direction: column;
                align-items: stretch;
            }
            #toolbar > div {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                justify-content: center;
            }
            #toolbar .btn {
                font-size: 0.72rem;
                padding: 0.3rem 0.5rem;
            }
            #toolbar .vr {
                display: none;
            }
            #rete-container {
                top: 0 !important;
            }
            .node {
                min-width: 160px !important;
            }
            .node-header {
                font-size: 0.72rem;
                padding: 5px 7px;
            }
            .node-content {
                font-size: 0.7rem;
                padding: 7px;
            }
            .node-actions .btn {
                padding: 0.15rem 0.3rem;
                font-size: 0.7rem;
            }
            .modal-dialog {
                margin: 0.5rem;
            }
            .modal-body {
                padding: 1rem !important;
            }
            .socket-points {
                display: none;
            }
        }

        #rete-container {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f0f2f5;
            overflow: hidden;
            cursor: grab;
        }

        #rete-container:active {
            cursor: grabbing;
        }

        #canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
        }

        #connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: visible;
        }

        .node {
            background: white;
            border: 2px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            position: absolute;
            min-width: 220px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            user-select: none;
            transition: border-color 0.2s;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }

        .node:hover {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .node-header {
            padding: 8px 12px;
            border-radius: 6px 6px 0 0;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .node-content {
            padding: 12px;
            font-size: 14px;
            position: relative;
        }

        .node-actions {
            border-top: 1px solid #eee;
            padding: 6px;
            display: flex;
            justify-content: flex-end;
            gap: 5px;
        }

        .task-node {
            border-color: var(--color-task);
        }

        .task-node .node-header {
            background: var(--color-task);
        }

        .subtask-node {
            border-color: var(--color-subtask);
        }

        .subtask-node .node-header {
            background: var(--color-subtask);
        }

        .access-node {
            border-color: var(--color-access);
        }

        .access-node .node-header {
            background: var(--color-access);
        }

        .billing-node {
            border-color: var(--color-billing);
        }

        .billing-node .node-header {
            background: var(--color-billing);
        }

        .media-node {
            border-color: var(--color-media);
        }

        .media-node .node-header {
            background: var(--color-media);
        }

        .badge-status {
            padding: 3px 8px;
            border-radius: 12px;
            color: white;
            font-size: 11px;
        }

        .bg-todo {
            background: #6c757d;
        }

        .bg-in-progress {
            background: #ffc107;
            color: #000;
        }

        .bg-done {
            background: #198754;
        }

        .bg-expense {
            background: #dc3545;
        }

        .bg-income {
            background: #198754;
        }

        .connection-line {
            stroke: #9ca3af;
            stroke-width: 2;
            fill: none;
        }

        .connection-line:hover {
            stroke: var(--color-task);
            stroke-width: 3;
            cursor: pointer;
        }

        .connecting-mode .node {
            cursor: crosshair;
        }

        .node.selected-source {
            border-color: #20c997;
            box-shadow: 0 0 10px #20c997;
        }

        .socket-points {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px dashed #eee;
            font-size: 11px;
            color: #666;
        }

        .socket {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid #666;
        }

        .socket-in {
            background: #eee;
            margin-right: 5px;
        }

        .socket-out {
            background: #eee;
            margin-left: 5px;
        }

        .socket-flow {
            background: var(--color-task);
            border-color: var(--color-task);
        }

        .socket-hierarchy {
            background: var(--color-subtask);
            border-color: var(--color-subtask);
        }

        .collapse-btn {
            background: none;
            border: none;
            color: white;
            padding: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="toolbar">
    <div class="d-flex align-items-center gap-2">
        <a href="{{ url('projects:project_detail', pk=project.id) }}" class="btn btn-outline-secondary btn-sm"><i
                class="bi bi-arrow-left"></i> {{ _('Назад') }}</a>
        <div class="vr"></div>
        <button class="btn btn-sm text-white" style="background: var(--color-task); border-color: var(--color-task);"
                onclick="viz.openModal('task')">
            <i class="bi bi-check-square"></i> {{ _('Задача') }}
        </button>
        <button class="btn btn-sm text-white"
                style="background: var(--color-subtask); border-color: var(--color-subtask);"
                onclick="viz.openModal('subtask')">
            <i class="bi bi-list-task"></i> {{ _('Подзадача') }}
        </button>
        <button class="btn btn-sm text-white"
                style="background: var(--color-access); border-color: var(--color-access);"
                onclick="viz.openModal('access')">
            <i class="bi bi-key"></i> {{ _('Доступ') }}
        </button>
        <button class="btn btn-sm text-white"
                style="background: var(--color-billing); border-color: var(--color-billing);"
                onclick="viz.openModal('billing')">
            <i class="bi bi-currency-dollar"></i> {{ _('Финансы') }}
        </button>
        <button class="btn btn-sm text-white" style="background: var(--color-media); border-color: var(--color-media);"
                onclick="viz.openModal('media')">
            <i class="bi bi-file-earmark-plus"></i> {{ _('Медиа') }}
        </button>
    </div>
    <div class="d-flex align-items-center gap-2">
        <a href="{{ url('projects:super_structure') }}" class="btn btn-outline-dark btn-sm"><i
                class="bi bi-diagram-3"></i> {{ _('Супер-структура') }}</a>
        <div class="vr"></div>
        <div class="btn-group">
            <button id="connect-flow-btn" class="btn btn-sm"
                    style="color: var(--color-task); border-color: var(--color-task); background: transparent;"
                    onclick="viz.toggleConnectMode('flow')"
                    title="{{ _('Задача -> Задача (Зависимость)') }}"><i class="bi bi-arrow-right"></i> {{ _('Поток') }}
            </button>
            <button id="connect-hier-btn" class="btn btn-sm"
                    style="color: var(--color-subtask); border-color: var(--color-subtask); background: transparent;"
                    onclick="viz.toggleConnectMode('hierarchy')"
                    title="{{ _('Задача -> Подзадача (Иерархия)') }}"><i
                    class="bi bi-diagram-2"></i> {{ _('Иерархия') }}
            </button>
        </div>
        <button class="btn btn-outline-dark btn-sm" onclick="viz.resetZoom()"><i class="bi bi-arrows-fullscreen"></i>
            100%
        </button>
        <button class="btn btn-outline-dark btn-sm" onclick="viz.autoLayout()"><i
                class="bi bi-grid-3x3"></i> {{ _('Авто') }}
        </button>
        <button class="btn btn-outline-info btn-sm" data-bs-toggle="modal" data-bs-target="#colorsModal"><i
                class="bi bi-palette"></i> {{ _('Цвета') }}</button>
        <button id="save-btn" class="btn btn-dark btn-sm"><i class="bi bi-cloud-upload"></i> {{ _('Сохранить') }}
        </button>
    </div>
</div>

<div id="rete-container">
    <div id="canvas-layer">
        <svg id="connections-layer"></svg>
        <div id="nodes-layer"></div>
    </div>
</div>

<div class="modal fade" id="colorsModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ _('Настройка цветов') }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label>{{ _('Задача') }}</label>
                    <input type="color" id="color-task" class="form-control form-control-color w-100">
                </div>
                <div class="mb-3">
                    <label>{{ _('Подзадача') }}</label>
                    <input type="color" id="color-subtask" class="form-control form-control-color w-100">
                </div>
                <div class="mb-3">
                    <label>{{ _('Доступ') }}</label>
                    <input type="color" id="color-access" class="form-control form-control-color w-100">
                </div>
                <div class="mb-3">
                    <label>{{ _('Финансы') }}</label>
                    <input type="color" id="color-billing" class="form-control form-control-color w-100">
                </div>
                <div class="mb-3">
                    <label>{{ _('Медиа') }}</label>
                    <input type="color" id="color-media" class="form-control form-control-color w-100">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-danger me-auto"
                        onclick="resetColors()">{{ _('По умолчанию') }}</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ _('Отмена') }}</button>
                <button type="button" class="btn btn-primary" onclick="saveColors()">{{ _('Сохранить') }}</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="nodeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">{{ _('Редактирование') }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary"
                        onclick="viz.saveNodeFromModal()">{{ _('Сохранить') }}</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="globalCropModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
     aria-hidden="true" style="z-index: 2000;">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">{{ _('Обрезать изображение') }}</h5>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4 text-center bg-white">
                <div style="max-height: 500px; width: 100%; overflow: hidden; display: flex; justify-content: center; background-color: #f8f9fa; border-radius: 10px;">
                    <img id="global-image-to-crop" src="" style="max-width: 100%; max-height: 500px; display: block;">
                </div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-light rounded-pill px-4"
                        data-bs-dismiss="modal">{{ _('Отмена') }}</button>
                <button type="button" class="btn btn-primary rounded-pill px-4"
                        id="global-crop-btn">{{ _('Применить') }}</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script>
    const defaultProjColors = {
        task: '#0d6efd',
        subtask: '#6610f2',
        access: '#fd7e14',
        billing: '#198754',
        media: '#DC143C'
    };

    let projColors = JSON.parse(localStorage.getItem('projColors')) || {...defaultProjColors};

    function applyColors() {
        document.documentElement.style.setProperty('--color-task', projColors.task);
        document.documentElement.style.setProperty('--color-subtask', projColors.subtask);
        document.documentElement.style.setProperty('--color-access', projColors.access);
        document.documentElement.style.setProperty('--color-billing', projColors.billing);
        document.documentElement.style.setProperty('--color-media', projColors.media);
    }

    function saveColors() {
        projColors.task = document.getElementById('color-task').value;
        projColors.subtask = document.getElementById('color-subtask').value;
        projColors.access = document.getElementById('color-access').value;
        projColors.billing = document.getElementById('color-billing').value;
        projColors.media = document.getElementById('color-media').value;
        localStorage.setItem('projColors', JSON.stringify(projColors));
        applyColors();
        bootstrap.Modal.getInstance(document.getElementById('colorsModal')).hide();
        if (viz) {
            viz.updateToolbar();
            viz.render();
        }
    }

    function resetColors() {
        projColors = {...defaultProjColors};
        document.getElementById('color-task').value = projColors.task;
        document.getElementById('color-subtask').value = projColors.subtask;
        document.getElementById('color-access').value = projColors.access;
        document.getElementById('color-billing').value = projColors.billing;
        document.getElementById('color-media').value = projColors.media;
        localStorage.setItem('projColors', JSON.stringify(projColors));
        applyColors();
        bootstrap.Modal.getInstance(document.getElementById('colorsModal')).hide();
        if (viz) {
            viz.updateToolbar();
            viz.render();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        applyColors();
        document.getElementById('color-task').value = projColors.task;
        document.getElementById('color-subtask').value = projColors.subtask;
        document.getElementById('color-access').value = projColors.access;
        document.getElementById('color-billing').value = projColors.billing;
        document.getElementById('color-media').value = projColors.media;

        let cropper = null;
        let currentFileInput = null;
        let originalFile = null;
        const imageToCrop = document.getElementById('global-image-to-crop');
        const cropModalElement = document.getElementById('globalCropModal');
        if (!cropModalElement) return;
        const cropModal = new bootstrap.Modal(cropModalElement);
        const cropBtn = document.getElementById('global-crop-btn');

        document.addEventListener('change', function (e) {
            if (e.target && e.target.classList.contains('image-crop-input')) {
                const files = e.target.files;
                if (files && files.length > 0) {
                    currentFileInput = e.target;
                    originalFile = files[0];
                    if (!originalFile.type.startsWith('image/')) return;
                    const url = URL.createObjectURL(originalFile);
                    imageToCrop.src = url;
                    cropModal.show();
                }
            }
        });

        cropModalElement.addEventListener('shown.bs.modal', function () {
            if (cropper) cropper.destroy();
            cropper = new Cropper(imageToCrop, {
                aspectRatio: NaN,
                viewMode: 1,
                autoCropArea: 1,
                dragMode: 'move',
                background: false,
            });
        });

        cropModalElement.addEventListener('hidden.bs.modal', function () {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            imageToCrop.src = '';
        });

        cropBtn.addEventListener('click', function () {
            if (!cropper || !currentFileInput) return;

            cropper.getCroppedCanvas({
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            }).toBlob(function (blob) {
                const fileName = originalFile ? originalFile.name : 'cropped.png';
                const croppedFile = new File([blob], fileName, {type: 'image/png', lastModified: new Date().getTime()});
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(croppedFile);
                currentFileInput.files = dataTransfer.files;

                const previewTargetSelector = currentFileInput.getAttribute('data-preview-target');
                if (previewTargetSelector) {
                    const previewTargets = document.querySelectorAll(previewTargetSelector);
                    previewTargets.forEach(target => {
                        target.src = URL.createObjectURL(blob);
                        target.style.display = 'block';
                        target.classList.remove('d-none');
                    });
                }
                cropModal.hide();
            }, 'image/png');
        });
    });

    const container = document.getElementById('rete-container');
    const canvasLayer = document.getElementById('canvas-layer');
    const nodesLayer = document.getElementById('nodes-layer');
    const svgLayer = document.getElementById('connections-layer');
    const modalEl = document.getElementById('nodeModal');
    const modalObj = new bootstrap.Modal(modalEl);

    class Visualization {
        constructor(projectId) {
            this.projectId = projectId;
            this.nodes = [];
            this.connections = [];
            this.users = [];
            this.currentNode = null;
            this.drag = {active: false, node: null, offX: 0, offY: 0};
            this.pan = {active: false, startX: 0, startY: 0, offX: 0, offY: 0};
            this.transform = {x: 0, y: 0, k: 1};
            this.connectMode = null;
            this.sourceNodeId = null;
            this.init();
        }

        async init() {
            await this.loadData();
            this.render();
            this.events();
        }

        async loadData() {
            try {
                const res = await fetch(`/api/projects/projects/${this.projectId}/structure/`);
                if (res.ok) {
                    const data = await res.json();
                    this.nodes = data.nodes || [];
                    this.connections = data.connections || [];
                    this.users = data.users || [];
                    if (this.nodes.length === 0) this.addNode('project', 'project', '{{ _("Проект") }}', 'active', 50, 50, {});
                }
            } catch (e) {
                console.error(e);
            }
        }

        addNode(id, type, title, status, x, y, data) {
            this.nodes.push({id, type, title, status, x, y, data, collapsed: false});
            this.render();
        }

        updateNode(id, newData) {
            const node = this.nodes.find(n => n.id === id);
            if (node) Object.assign(node, newData);
            this.render();
        }

        deleteNode(id) {
            if (confirm('{{ _("Удалить элемент?") }}')) {
                this.nodes = this.nodes.filter(n => n.id !== id);
                this.connections = this.connections.filter(c => c.source !== id && c.target !== id);
                this.render();
            }
        }

        toggleConnectMode(mode) {
            if (this.connectMode === mode) {
                this.connectMode = null;
                this.sourceNodeId = null;
                document.body.classList.remove('connecting-mode');
            } else {
                this.connectMode = mode;
                this.sourceNodeId = null;
                document.body.classList.add('connecting-mode');
            }
            this.updateToolbar();
            this.render();
        }

        updateToolbar() {
            const btnFlow = document.getElementById('connect-flow-btn');
            const btnHier = document.getElementById('connect-hier-btn');

            btnFlow.classList.remove('active');
            btnFlow.style.backgroundColor = 'transparent';
            btnFlow.style.color = 'var(--color-task)';
            btnFlow.style.borderColor = 'var(--color-task)';

            btnHier.classList.remove('active');
            btnHier.style.backgroundColor = 'transparent';
            btnHier.style.color = 'var(--color-subtask)';
            btnHier.style.borderColor = 'var(--color-subtask)';

            if (this.connectMode === 'flow') {
                btnFlow.classList.add('active');
                btnFlow.style.backgroundColor = 'var(--color-task)';
                btnFlow.style.color = 'white';
            } else if (this.connectMode === 'hierarchy') {
                btnHier.classList.add('active');
                btnHier.style.backgroundColor = 'var(--color-subtask)';
                btnHier.style.color = 'white';
            }
        }

        handleNodeClick(nodeId) {
            if (this.connectMode) {
                if (!this.sourceNodeId) {
                    this.sourceNodeId = nodeId;
                    this.render();
                } else {
                    if (this.sourceNodeId !== nodeId) {
                        const exists = this.connections.find(c => c.source === this.sourceNodeId && c.target === nodeId);
                        if (!exists) {
                            const source = this.nodes.find(n => n.id === this.sourceNodeId);
                            const target = this.nodes.find(n => n.id === nodeId);

                            let allowed = false;
                            if (this.connectMode === 'flow') {
                                if (source.type === 'task' && target.type === 'task') allowed = true;
                            } else if (this.connectMode === 'hierarchy') {
                                if (source.type === 'task' && target.type === 'subtask') allowed = true;
                            }

                            if (allowed) {
                                this.connections.push({source: this.sourceNodeId, target: nodeId});
                            } else {
                                alert('{{ _("Неверный тип связи для выбранных узлов") }}');
                            }
                        }
                    }
                    this.sourceNodeId = null;
                    this.toggleConnectMode(null);
                }
            }
        }

        toggleTaskCollapse(nodeId) {
            const node = this.nodes.find(n => n.id === nodeId);
            if (node) {
                node.collapsed = !node.collapsed;
                this.render();
            }
        }

        isNodeVisible(nodeId) {
            const node = this.nodes.find(n => n.id === nodeId);
            if (!node) return false;

            if (node.type === 'subtask') {
                const parentConn = this.connections.find(c => c.target === nodeId && this.nodes.find(sn => sn.id === c.source)?.type === 'task');
                if (parentConn) {
                    const parent = this.nodes.find(n => n.id === parentConn.source);
                    if (parent && parent.collapsed) return false;
                }
            }
            return true;
        }

        openModal(type, nodeId = null) {
            this.currentNode = nodeId ? this.nodes.find(n => n.id === nodeId) : null;
            const isEdit = !!this.currentNode;
            const titleEl = document.getElementById('modalTitle');
            const bodyEl = document.getElementById('modalBody');

            titleEl.textContent = isEdit ? '{{ _("Редактировать") }}' : '{{ _("Создать") }}';

            let html = '';
            const data = isEdit ? this.currentNode.data : {};
            const status = isEdit ? this.currentNode.status : '';

            const userOptions = this.users.map(u =>
                `<option value="${u.id}" ${data.assignee == u.id ? 'selected' : ''}>${u.username}</option>`
            ).join('');
            const usersSelect = `
                <label>{{ _("Исполнитель") }}</label>
                <select id="inp-assignee" class="form-select mb-2">
                    <option value="">{{ _("Не назначен") }}</option>
                    ${userOptions}
                </select>`;

            if (type === 'task' || type === 'subtask') {
                html = `
                    <label>{{ _("Название") }}</label><input type="text" id="inp-title" class="form-control mb-2" value="${data.title || ''}">
                    <label>{{ _("Статус") }}</label>
                    <select id="inp-status" class="form-select mb-2">
                        <option value="todo" ${status === 'todo' ? 'selected' : ''}>{{ _("К выполнению") }}</option>
                        <option value="in_progress" ${status === 'in_progress' ? 'selected' : ''}>{{ _("В работе") }}</option>
                        <option value="done" ${status === 'done' ? 'selected' : ''}>{{ _("Готово") }}</option>
                    </select>
                    ${usersSelect}`;
            } else if (type === 'access') {
                html = `
                    <label>{{ _("Описание") }}</label><input type="text" id="inp-desc" class="form-control mb-2" value="${data.description || ''}">
                    <label>URL</label><input type="text" id="inp-url" class="form-control mb-2" value="${data.url || ''}">
                    <label>Google Drive</label><input type="text" id="inp-drive" class="form-control mb-2" value="${data.url_drive || ''}">
                    <label>{{ _("Логин") }}</label><input type="text" id="inp-login" class="form-control mb-2" value="${data.login || ''}">
                    <label>{{ _("Пароль") }}</label><input type="text" id="inp-pass" class="form-control" value="${data.password || ''}">`;
            } else if (type === 'billing') {
                html = `
                    <label>{{ _("Сумма") }}</label><input type="number" id="inp-amount" class="form-control mb-2" value="${data.amount || ''}">
                    <label>{{ _("Тип") }}</label>
                    <select id="inp-status" class="form-select">
                        <option value="expense" ${status === 'expense' ? 'selected' : ''}>{{ _("Расход") }}</option>
                        <option value="income" ${status === 'income' ? 'selected' : ''}>{{ _("Доход") }}</option>
                    </select>`;
            } else if (type === 'media') {
                html = `<label>{{ _("Описание / Название") }}</label><input type="text" id="inp-title" class="form-control mb-2" value="${data.title || ''}">`;
                if (isEdit && data.file_url) {
                    html += `<div class="mb-2 text-break" style="font-size:12px;"><strong>{{ _("Файл") }}:</strong> <a href="${data.file_url}" target="_blank">${data.file_url}</a></div>`;
                }
                html += `<label>${isEdit ? '{{ _("Заменить файл") }}' : '{{ _("Файл") }}'}</label><input type="file" id="inp-file" class="form-control image-crop-input" accept="image/*">`;
            }

            bodyEl.innerHTML = html;
            bodyEl.dataset.type = type;
            modalObj.show();
        }

        async saveNodeFromModal() {
            const bodyEl = document.getElementById('modalBody');
            const type = bodyEl.dataset.type;
            const isEdit = !!this.currentNode;

            let title, status, data = {};

            if (type === 'task' || type === 'subtask') {
                title = document.getElementById('inp-title').value;
                status = document.getElementById('inp-status').value;
                const assignee = document.getElementById('inp-assignee').value;
                data = {title, assignee};
            } else if (type === 'access') {
                data = {
                    description: document.getElementById('inp-desc').value,
                    url: document.getElementById('inp-url').value,
                    url_drive: document.getElementById('inp-drive').value,
                    login: document.getElementById('inp-login').value,
                    password: document.getElementById('inp-pass').value
                };
                title = data.description || data.login;
                status = 'active';
            } else if (type === 'billing') {
                data = {amount: document.getElementById('inp-amount').value};
                status = document.getElementById('inp-status').value;
                title = `${data.amount}`;
            } else if (type === 'media') {
                title = document.getElementById('inp-title').value;
                const fileInput = document.getElementById('inp-file');

                if (!isEdit) {
                    if (fileInput.files.length > 0) {
                        const formData = new FormData();
                        formData.append('file', fileInput.files[0]);
                        formData.append('project', this.projectId);
                        formData.append('description', title);
                        try {
                            const res = await fetch('/api/media/media_files/', {
                                method: 'POST',
                                headers: {'X-CSRFToken': this.getCookie('csrftoken')},
                                body: formData
                            });
                            if (res.ok) {
                                const mediaData = await res.json();
                                this.addNode('media_' + mediaData.id, 'media', title || mediaData.file, 'active', 100, 100, {
                                    db_id: mediaData.id,
                                    title: title || mediaData.file,
                                    file_url: mediaData.file
                                });
                                modalObj.hide();
                                return;
                            }
                        } catch (e) {
                            console.error(e);
                        }
                    }
                } else {
                    if (fileInput.files.length > 0) {
                        const formData = new FormData();
                        formData.append('file', fileInput.files[0]);
                        try {
                            const res = await fetch(`/api/media/media_files/${this.currentNode.data.db_id}/`, {
                                method: 'PATCH',
                                headers: {'X-CSRFToken': this.getCookie('csrftoken')},
                                body: formData
                            });
                            if (res.ok) {
                                const updatedMedia = await res.json();
                                data.file_url = updatedMedia.file;
                            }
                        } catch (e) {
                            console.error(e);
                        }
                    }
                    data.title = title;
                }
                status = 'active';
            }

            if (isEdit) {
                this.updateNode(this.currentNode.id, {title, status, data: {...this.currentNode.data, ...data}});
            } else if (type !== 'media') {
                this.addNode('temp_' + Date.now(), type, title, status, 100, 100, data);
            }
            modalObj.hide();
        }

        render() {
            nodesLayer.innerHTML = '';
            svgLayer.innerHTML = '';

            canvasLayer.style.transform = `translate(${this.transform.x}px, ${this.transform.y}px) scale(${this.transform.k})`;

            this.connections.forEach(c => {
                if (!this.isNodeVisible(c.source) || !this.isNodeVisible(c.target)) return;

                const source = this.nodes.find(n => n.id === c.source);
                const target = this.nodes.find(n => n.id === c.target);
                if (source && target) {
                    let color = '#9ca3af';
                    if (source.type === 'task' && target.type === 'task') color = 'var(--color-task)';
                    if (source.type === 'task' && target.type === 'subtask') color = 'var(--color-subtask)';

                    this.drawArrow(source, target, color);
                }
            });

            this.nodes.forEach(n => {
                if (!this.isNodeVisible(n.id)) return;

                const el = document.createElement('div');
                el.className = `node ${n.type}-node`;
                if (this.sourceNodeId === n.id) el.classList.add('selected-source');

                el.style.left = n.x + 'px';
                el.style.top = n.y + 'px';

                let icon = 'circle';
                let typeName = n.type.toUpperCase();

                if (n.type === 'task') {
                    icon = 'check-square';
                    typeName = '{{ _("ЗАДАЧА") }}';
                } else if (n.type === 'subtask') {
                    icon = 'list-task';
                    typeName = '{{ _("ПОДЗАДАЧА") }}';
                } else if (n.type === 'access') {
                    icon = 'key';
                    typeName = '{{ _("ДОСТУП") }}';
                } else if (n.type === 'billing') {
                    icon = 'currency-dollar';
                    typeName = '{{ _("ФИНАНСЫ") }}';
                } else if (n.type === 'media') {
                    icon = 'file-earmark';
                    typeName = '{{ _("МЕДИА") }}';
                } else if (n.type === 'project') {
                    icon = 'folder';
                    typeName = '{{ _("ПРОЕКТ") }}';
                }

                let badges = '';
                if (n.status && n.type !== 'access' && n.type !== 'media') {
                    let cl = 'bg-secondary';
                    let statusName = n.status;
                    if (n.status === 'todo') {
                        cl = 'bg-todo';
                        statusName = '{{ _("К выполнению") }}';
                    }
                    if (n.status === 'in_progress') {
                        cl = 'bg-in-progress';
                        statusName = '{{ _("В работе") }}';
                    }
                    if (n.status === 'done') {
                        cl = 'bg-done';
                        statusName = '{{ _("Готово") }}';
                    }
                    if (n.status === 'income') {
                        cl = 'bg-done';
                        statusName = '{{ _("Доход") }}';
                    }
                    if (n.status === 'expense') {
                        cl = 'bg-expense';
                        statusName = '{{ _("Расход") }}';
                    }
                    badges = `<span class="badge-status ${cl}">${statusName}</span>`;
                }

                if (n.data.assignee) {
                    const user = this.users.find(u => u.id == n.data.assignee);
                    if (user) {
                        badges += ` <span class="badge bg-info text-dark" style="font-size:10px;"><i class="bi bi-person"></i> ${user.username}</span>`;
                    }
                }

                const canEdit = n.type !== 'project';
                let collapseBtn = '';
                if (n.type === 'task') {
                    const hasSubtasks = this.connections.some(c => c.source === n.id && this.nodes.find(t => t.id === c.target)?.type === 'subtask');
                    if (hasSubtasks) {
                        const iconCls = n.collapsed ? 'bi-chevron-down' : 'bi-chevron-up';
                        collapseBtn = `<button class="collapse-btn ms-2" onmousedown="event.stopPropagation()" onclick="viz.toggleTaskCollapse('${n.id}')"><i class="bi ${iconCls}"></i></button>`;
                    }
                }

                let socketsHtml = '';
                if (n.type === 'task') {
                    socketsHtml = `
                        <div class="socket-points">
                            <div><span class="socket socket-flow socket-in" title="{{ _("Вход (Зависимость)") }}"></span></div>
                            <div>
                                <span class="socket socket-hierarchy socket-out" title="{{ _("Подзадачи") }}"></span>
                                <span class="socket socket-flow socket-out" title="{{ _("Выход (Зависимость)") }}"></span>
                            </div>
                        </div>`;
                } else if (n.type === 'subtask') {
                    socketsHtml = `
                        <div class="socket-points">
                            <div><span class="socket socket-hierarchy socket-in" title="{{ _("Родитель") }}"></span></div>
                        </div>`;
                }

                el.innerHTML = `
                    <div class="node-header">
                        <div class="d-flex align-items-center">
                            <span><i class="bi bi-${icon}"></i> ${typeName}</span>
                        </div>
                        ${collapseBtn}
                    </div>
                    <div class="node-content">
                        <strong>${n.title}</strong><br>${badges}
                    </div>
                    ${socketsHtml}
                    ${canEdit ? `
                    <div class="node-actions">
                        <button class="btn btn-sm btn-light text-primary py-0 px-1" onclick="event.stopPropagation(); viz.openModal('${n.type}', '${n.id}')" title="{{ _("Редактировать") }}"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-light text-danger py-0 px-1" onclick="event.stopPropagation(); viz.deleteNode('${n.id}')" title="{{ _("Удалить") }}"><i class="bi bi-trash"></i></button>
                    </div>` : ''}
                `;

                el.onmousedown = (e) => {
                    if (this.connectMode) return;
                    e.stopPropagation();
                    this.drag = {active: true, node: n, offX: e.offsetX, offY: e.offsetY};
                };

                el.ontouchstart = (e) => {
                    if (e.touches.length === 1) {
                        e.stopPropagation();
                    }
                };

                el.onclick = (e) => {
                    e.stopPropagation();
                    this.handleNodeClick(n.id);
                };

                nodesLayer.appendChild(el);
            });
        }

        drawArrow(source, target, color) {
            const sx = source.x + 110;
            const sy = source.y + 50;
            const tx = target.x + 110;
            const ty = target.y + 50;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", sx);
            line.setAttribute("y1", sy);
            line.setAttribute("x2", tx);
            line.setAttribute("y2", ty);
            line.setAttribute("class", "connection-line");
            line.setAttribute("stroke", color);
            line.setAttribute("marker-end", "url(#arrowhead)");

            svgLayer.appendChild(line);
        }

        resetZoom() {
            this.transform = {x: 0, y: 0, k: 1};
            this.render();
        }

        events() {
            container.onmousedown = (e) => {
                if (!this.drag.active && !this.connectMode) {
                    this.pan = {
                        active: true,
                        startX: e.clientX,
                        startY: e.clientY,
                        offX: this.transform.x,
                        offY: this.transform.y
                    };
                    container.style.cursor = 'grabbing';
                }
            };

            document.onmousemove = (e) => {
                if (this.drag.active && this.drag.node) {
                    this.drag.node.x = (e.clientX - container.getBoundingClientRect().left - this.transform.x) / this.transform.k - this.drag.offX;
                    this.drag.node.y = (e.clientY - container.getBoundingClientRect().top - this.transform.y) / this.transform.k - this.drag.offY;
                    this.render();
                } else if (this.pan.active) {
                    this.transform.x = this.pan.offX + (e.clientX - this.pan.startX);
                    this.transform.y = this.pan.offY + (e.clientY - this.pan.startY);
                    this.render();
                }
            };

            document.onmouseup = () => {
                this.drag.active = false;
                this.drag.node = null;
                this.pan.active = false;
                container.style.cursor = 'grab';
            };

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const scaleAmount = -e.deltaY * 0.001;
                const newScale = Math.min(Math.max(0.1, this.transform.k + scaleAmount), 5);

                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const nodeX = (mouseX - this.transform.x) / this.transform.k;
                const nodeY = (mouseY - this.transform.y) / this.transform.k;

                this.transform.x = mouseX - nodeX * newScale;
                this.transform.y = mouseY - nodeY * newScale;
                this.transform.k = newScale;

                this.render();
            }, {passive: false});

            // Touch events
            this.lastTouchDist = 0;
            this.touchDragNode = null;
            this.touchDragOff = {x: 0, y: 0};

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    const t = e.touches[0];
                    const target = document.elementFromPoint(t.clientX, t.clientY);
                    const nodeEl = target ? target.closest('.node') : null;

                    if (nodeEl && !this.connectMode) {
                        const nodeData = this.nodes.find(n => {
                            const rect = nodeEl.getBoundingClientRect();
                            return t.clientX >= rect.left && t.clientX <= rect.right && t.clientY >= rect.top && t.clientY <= rect.bottom;
                        });
                        if (nodeData && nodeData.type !== 'project') {
                            e.preventDefault();
                            const rect = container.getBoundingClientRect();
                            this.drag = {
                                active: true,
                                node: nodeData,
                                offX: (t.clientX - rect.left - this.transform.x) / this.transform.k - nodeData.x,
                                offY: (t.clientY - rect.top - this.transform.y) / this.transform.k - nodeData.y
                            };
                            return;
                        }
                    }
                    if (target === container || target === svgLayer || target.id === 'canvas-layer' || !nodeEl) {
                        e.preventDefault();
                        this.pan = {
                            active: true,
                            startX: t.clientX,
                            startY: t.clientY,
                            offX: this.transform.x,
                            offY: this.transform.y
                        };
                    }
                } else if (e.touches.length === 2) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    this.lastTouchDist = Math.hypot(dx, dy);
                }
            }, {passive: false});

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) {
                    e.preventDefault();
                    const t = e.touches[0];
                    if (this.drag.active && this.drag.node) {
                        const rect = container.getBoundingClientRect();
                        this.drag.node.x = (t.clientX - rect.left - this.transform.x) / this.transform.k - this.drag.offX;
                        this.drag.node.y = (t.clientY - rect.top - this.transform.y) / this.transform.k - this.drag.offY;
                        this.render();
                    } else if (this.pan.active) {
                        this.transform.x = this.pan.offX + (t.clientX - this.pan.startX);
                        this.transform.y = this.pan.offY + (t.clientY - this.pan.startY);
                        this.render();
                    }
                } else if (e.touches.length === 2) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const dist = Math.hypot(dx, dy);
                    if (this.lastTouchDist > 0) {
                        const rect = container.getBoundingClientRect();
                        const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
                        const my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
                        const nodeX = (mx - this.transform.x) / this.transform.k;
                        const nodeY = (my - this.transform.y) / this.transform.k;
                        const newScale = Math.min(Math.max(0.1, this.transform.k * (dist / this.lastTouchDist)), 5);
                        this.transform.x = mx - nodeX * newScale;
                        this.transform.y = my - nodeY * newScale;
                        this.transform.k = newScale;
                        this.render();
                    }
                    this.lastTouchDist = dist;
                }
            }, {passive: false});

            container.addEventListener('touchend', (e) => {
                this.drag.active = false;
                this.drag.node = null;
                this.pan.active = false;
                this.lastTouchDist = 0;
                container.style.cursor = 'grab';
            });

            if (!document.getElementById('arrowhead')) {
                const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
                defs.innerHTML = `
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af" />
                    </marker>`;
                svgLayer.appendChild(defs);
            }

            document.getElementById('save-btn').onclick = async () => {
                const btn = document.getElementById('save-btn');
                btn.disabled = true;
                btn.innerHTML = '<i class="bi bi-hourglass"></i> ...';
                try {
                    const res = await fetch(`/api/projects/projects/${this.projectId}/structure/`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json', 'X-CSRFToken': this.getCookie('csrftoken')},
                        body: JSON.stringify({nodes: this.nodes, connections: this.connections})
                    });
                    if (!res.ok) throw new Error('Error');
                    location.reload();
                } catch (e) {
                    alert('{{ _("Ошибка сохранения") }}');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-cloud-upload"></i> {{ _("Сохранить") }}';
                }
            };
        }

        autoLayout() {
            let x = 50, y = 50;
            this.nodes.forEach((n, i) => {
                if (n.type === 'subtask' && !this.isNodeVisible(n.id)) return;
                n.x = x;
                n.y = y;
                x += 250;
                if ((i + 1) % 4 === 0) {
                    x = 50;
                    y += 180;
                }
            });
            this.render();
        }

        getCookie(name) {
            let v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
            return v ? v[2] : null;
        }
    }

    const projectId = "{{ project.id }}";
    const viz = new Visualization(projectId);
</script>
</body>
</html>
