<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Структура проекта - Rete.js</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        #toolbar {
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #rete-container {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
        }

        .node {
            background: white;
            border: 2px solid #ccc;
            border-radius: 10px;
            cursor: pointer;
            position: absolute;
            min-width: 180px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .node-header {
            padding: 8px 12px;
            border-radius: 8px 8px 0 0;
            color: white;
            font-weight: bold;
        }

        .node-content {
            padding: 10px;
        }

        .task-node {
            border-color: #4682b4;
        }

        .task-node .node-header {
            background: #4682b4;
        }

        .access-node {
            border-color: #6f42c1;
        }

        .access-node .node-header {
            background: #6f42c1;
        }

        .billing-node {
            border-color: #198754;
        }

        .billing-node .node-header {
            background: #198754;
        }

        .project-node {
            border-color: #dc3545;
        }

        .project-node .node-header {
            background: #dc3545;
        }

        .node-status {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-top: 5px;
            color: white;
        }

        .status-todo {
            background: #6c757d;
        }

        .status-in-progress {
            background: #ffc107;
            color: black;
        }

        .status-done {
            background: #198754;
        }

        .status-income {
            background: #198754;
        }

        .status-expense {
            background: #dc3545;
        }
    </style>
</head>
<body>
<div id="toolbar">
    <div>
        <a href="/projects/" class="btn btn-outline-secondary btn-sm me-2"><i class="bi bi-arrow-left"></i> Назад</a>
        <button class="btn btn-primary btn-sm me-1" onclick="modal('taskModal')"><i class="bi bi-check-square"></i>
            Задача
        </button>
        <button class="btn btn-purple btn-sm me-1" style="background-color: #6f42c1; color: white;"
                onclick="modal('accessModal')"><i class="bi bi-key"></i> Доступ
        </button>
        <button class="btn btn-success btn-sm me-2" onclick="modal('billingModal')"><i
                class="bi bi-currency-dollar"></i> Финансы
        </button>
        <button id="save-btn" class="btn btn-dark btn-sm"><i class="bi bi-save"></i> Сохранить</button>
    </div>
    <div>
        <button id="auto-layout-btn" class="btn btn-outline-secondary btn-sm"><i class="bi bi-grid"></i></button>
    </div>
</div>

<div id="rete-container"></div>

<div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Новая задача</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" class="form-control mb-2" id="task-title" placeholder="Название">
                <select class="form-select" id="task-status">
                    <option value="todo">К выполнению</option>
                    <option value="in_progress">В работе</option>
                    <option value="done">Готово</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="viz.createTask()">Создать</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="accessModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Новый доступ</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" class="form-control mb-2" id="acc-url" placeholder="URL">
                <input type="text" class="form-control mb-2" id="acc-login" placeholder="Логин">
                <input type="password" class="form-control" id="acc-pass" placeholder="Пароль">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="viz.createAccess()">Создать</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="billingModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Финансы</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="number" class="form-control mb-2" id="bill-amount" placeholder="Сумма">
                <select class="form-select" id="bill-op">
                    <option value="expense">Расход</option>
                    <option value="income">Доход</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="viz.createBilling()">Создать</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const container = document.getElementById('rete-container');
    const modal = (id) => new bootstrap.Modal(document.getElementById(id)).show();

    class SimpleVisualization {
        constructor(projectId) {
            this.projectId = projectId;
            this.nodes = [];
            this.connections = [];
            this.zoom = 1;
            this.drag = {active: false, node: null, offX: 0, offY: 0};
            this.init();
        }

        async init() {
            await this.loadData();
            this.render();
            this.events();
        }

        async loadData() {
            const res = await fetch(`/api/projects/${this.projectId}/structure/`);
            if (res.ok) {
                const data = await res.json();
                this.nodes = data.nodes || [];
                this.connections = data.connections || [];
                if (this.nodes.length === 0) this.addNode('project', 'project', 'Проект', 'in_progress', 50, 50, {});
            }
        }

        addNode(id, type, title, status, x, y, data) {
            this.nodes.push({id, type, title, status, x, y, data});
            this.render();
        }

        createTask() {
            const title = document.getElementById('task-title').value;
            const status = document.getElementById('task-status').value;
            if (title) {
                this.addNode('temp_' + Date.now(), 'task', title, status, 100, 100, {title});
                bootstrap.Modal.getInstance(document.getElementById('taskModal')).hide();
            }
        }

        createAccess() {
            const url = document.getElementById('acc-url').value;
            const login = document.getElementById('acc-login').value;
            const pass = document.getElementById('acc-pass').value;
            if (login) {
                this.addNode('temp_' + Date.now(), 'access', login, 'active', 100, 100, {url, login, password: pass});
                bootstrap.Modal.getInstance(document.getElementById('accessModal')).hide();
            }
        }

        createBilling() {
            const amount = document.getElementById('bill-amount').value;
            const op = document.getElementById('bill-op').value;
            if (amount) {
                this.addNode('temp_' + Date.now(), 'billing', amount, op, 100, 100, {amount});
                bootstrap.Modal.getInstance(document.getElementById('billingModal')).hide();
            }
        }

        render() {
            container.innerHTML = '';
            this.nodes.forEach(n => {
                const el = document.createElement('div');
                el.className = `node ${n.type}-node`;
                el.style.left = n.x + 'px';
                el.style.top = n.y + 'px';

                let icon = 'circle';
                if (n.type === 'task') icon = 'check-square';
                if (n.type === 'access') icon = 'key';
                if (n.type === 'billing') icon = 'currency-dollar';
                if (n.type === 'project') icon = 'folder';

                let statusBadge = '';
                if (n.status) statusBadge = `<div class="node-status status-${n.status.replace('_', '-')}">${n.status}</div>`;

                el.innerHTML = `
                        <div class="node-header"><i class="bi bi-${icon}"></i> ${n.type.toUpperCase()}</div>
                        <div class="node-content"><strong>${n.title}</strong><br>${statusBadge}</div>
                    `;
                el.onmousedown = (e) => {
                    this.drag = {active: true, node: n, offX: e.offsetX, offY: e.offsetY};
                };
                container.appendChild(el);
            });
        }

        events() {
            document.onmousemove = (e) => {
                if (this.drag.active && this.drag.node) {
                    this.drag.node.x = e.clientX - this.drag.offX;
                    this.drag.node.y = e.clientY - 60 - this.drag.offY;
                    this.render(); // Simple re-render, optimize for prod
                }
            };
            document.onmouseup = () => {
                this.drag.active = false;
                this.drag.node = null;
            };

            document.getElementById('save-btn').onclick = async () => {
                await fetch(`/api/projects/${this.projectId}/structure/`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': this.getCookie('csrftoken')},
                    body: JSON.stringify({nodes: this.nodes, connections: this.connections})
                });
                alert('Сохранено!');
                location.reload();
            };

            document.getElementById('auto-layout-btn').onclick = () => {
                let y = 50;
                this.nodes.forEach((n, i) => {
                    n.x = 50 + (i % 4) * 250;
                    n.y = y;
                    if (i % 4 === 3) y += 150;
                });
                this.render();
            }
        }

        getCookie(name) {
            let v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
            return v ? v[2] : null;
        }
    }

    const projectId = window.location.pathname.split('/').filter(Boolean).pop();
    const viz = new SimpleVisualization(projectId);
</script>
</body>
</html>
