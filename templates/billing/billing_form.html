{% extends "base.html" %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0">{% if object %}Редактировать{% else %}Добавить{% endif %} операцию</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                        <div class="d-none">{{ form.project }}</div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Дата</label>
                                {{ form.date }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Сумма</label>
                                {{ form.amount }}
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Тип</label>
                                {{ form.operation }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Категория</label>
                                {{ form.tag }}
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            {{ form.description }}
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <button type="button" class="btn btn-secondary" onclick="history.back()">Назад</button>
                            <button type="submit" class="btn btn-success px-4">Сохранить</button>
                        </div>
                    </form>
                    {% if object %}
                        <div class="text-end mt-3 border-top pt-3">
                            <form action="{{ url('billing:billing_delete', pk=object.pk) }}" method="post">
                                <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                                <button type="submit" class="btn btn-outline-danger btn-sm">Удалить</button>
                            </form>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
{% endblock %}
