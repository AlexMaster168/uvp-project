{% extends "base.html" %}
{% block title %}{% if object %}Редактировать запись{% else %}Новая запись{% endif %} - Финансы{% endblock %}
{% block content %}
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h4>{% if object %}Редактировать запись{% else %}Добавить финансовую запись{% endif %}</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {{ csrf_input }}
                        <div class="mb-3">
                            <label for="id_project" class="form-label">Проект</label>
                            <select class="form-select" id="id_project" name="project" required>
                                {% for project in view.model.project.field.related_model.objects.all() %}
                                    <option value="{{ project.id }}"
                                            {% if (object and object.project.id == project.id) or (request.GET.project|int == project.id) %}selected{% endif %}>{{ project.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="id_date" class="form-label">Дата</label>
                                <input type="date" class="form-control" id="id_date" name="date"
                                       value="{{ object.date if object else '' }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="id_amount" class="form-label">Сумма</label>
                                <input type="number" step="0.01" class="form-control" id="id_amount" name="amount"
                                       value="{{ object.amount if object else '' }}" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="id_operation" class="form-label">Операция</label>
                            <select class="form-select" id="id_operation" name="operation">
                                {% for code, label in view.model.OPERATION_CHOICES %}
                                    <option value="{{ code }}"
                                            {% if object and object.operation == code %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="id_tag" class="form-label">Категория (Тег)</label>
                            <select class="form-select" id="id_tag" name="tag">
                                {% for code, label in view.model.TAG_CHOICES %}
                                    <option value="{{ code }}"
                                            {% if object and object.tag == code %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="id_description" class="form-label">Описание</label>
                            <textarea class="form-control" id="id_description" name="description"
                                      rows="3">{{ object.description if object else '' }}</textarea>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="

                                    {% if object %}{{ url('projects:project_detail', pk=object.project.id) }}{% elif request.GET.project %}{{ url('projects:project_detail', pk=request.GET.project) }}{% else %}{{ url('billing:billing_list') }}{% endif %}"
                               class="btn btn-secondary">Отмена</a>
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
