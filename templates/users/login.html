{% extends "base.html" %}
{% block content %}
    <div class="row justify-content-center mt-5">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h3 class="text-center">Вход</h3>
                    <form method="post">
                        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                        <div class="mb-3"><label>Пользователь</label><input type="text" name="username"
                                                                            class="form-control" required></div>
                        <div class="mb-3"><label>Пароль</label><input type="password" name="password"
                                                                      class="form-control" required></div>
                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="/accounts/google/login/?process=login" class="btn btn-outline-danger w-100">
                            <i class="bi bi-google"></i> Войти через Google
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
