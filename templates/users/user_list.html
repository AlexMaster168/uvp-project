{% extends "base.html" %}
{% block title %}Пользователи{% endblock %}
{% block content %}
    <div class="card">
        <div class="card-header">
            <h4>Пользователи</h4>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Имя</th>
                    <th>Email</th>
                    <th>Telegram</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                {% for u in users %}
                    <tr>
                        <td>{{ u.username }}</td>
                        <td>{{ u.email }}</td>
                        <td>{{ u.telegram_id|default:"-" }}</td>
                        <td>
                            <a href="{% url 'users:user_detail' pk=u.id %}" class="btn btn-sm btn-outline-primary">Профиль</a>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
